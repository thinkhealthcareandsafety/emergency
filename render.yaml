# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# Demo setup: in-memory database (data resets when the service restarts or sleeps) and QR punching ON.
# For permanent data, add a MONGO_URI env var (e.g. a free MongoDB Atlas cluster) and set DEMO_PUNCH=false.
services:
  - type: web
    name: ert-live
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix server && npm install --prefix client --include=dev && npm run build --prefix client
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DEMO_PUNCH
        value: "true"
      # The root URL opens the wall screen without a key (demo). Set to "false" to require ?key=DISPLAY_KEY.
      - key: DISPLAY_PUBLIC
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      # Strong random values generated by Render. Find them under the service's Environment tab.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DISPLAY_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
      - key: DEMO_PUNCH_KEY
        generateValue: true
